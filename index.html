</style></head><body><div id="root"></div><script>
const SB='https://cikobcunfmnvlyutlyai.supabase.co',KEY='sb_publishable_zCLquIbqu_xm4Gps9fBmsg_CbEV6G10',REST=SB+'/rest/v1',ADMIN=SB+'/functions/v1/theology-admin',AI='https://than-theology-ai-buichithan221199-9344.vercel.app/api/process';
const S={lessons:[],questions:[],folders:[],tab:'home',selected:null,pin:'',revealed:{}};const H={'apikey':KEY,'Authorization':'Bearer '+KEY};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function q(path){const r=await fetch(REST+path,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}
async function adm(action,payload={},pin=S.pin){const r=await fetch(ADMIN,{method:'POST',headers:{'content-type':'application/json','x-admin-pin':pin},body:JSON.stringify({action,...payload})});const j=await r.json();if(!r.ok)throw Error(j.error||'Lỗi quản trị');return j}
async function load(){[S.folders,S.lessons,S.questions]=await Promise.all([q('/folders?select=*&order=sort_order'),q('/lessons?select=*&is_published=eq.true&order=lesson_date.desc.nullslast,created_at.desc'),q('/questions?select=*&order=sort_order')]);render()}
function nav(){return `<aside class="side"><div class="brand"><b>Thư Viện<br>Thần Học</b><span>Hành trình đức tin</span></div><div class="nav"><button class="${S.tab==='home'?'on':''}" onclick="go('home')">⌂ <span>Trang chủ</span></button><button class="${S.tab==='lessons'?'on':''}" onclick="go('lessons')">▤ <span>Bài học</span></button><button class="${S.tab==='quiz'?'on':''}" onclick="go('quiz')">? <span>Câu hỏi</span></button><button onclick="openImport()">＋ <span>Thêm nội dung</span></button><button class="${S.tab==='search'?'on':''}" onclick="go('search')">⌕ <span>Tìm kiếm</span></button><button id="aiCostNavBtn" onclick="location.href='./ai-cost.html'">💳 <span>Chi phí AI</span></button></div></aside>`}
function render(){document.querySelector('#root').innerHTML=`<div class="app">${nav()}<main class="main"><header class="top"><h1>${S.tab==='home'?'Thư Viện Thần Học':S.tab==='lessons'?'Bài học':S.tab==='quiz'?'Câu hỏi & Đáp án':S.tab==='detail'?'Chi tiết bài học':'Tìm kiếm'}</h1><button class="btn gold" onclick="openImport()">+ Thêm nội dung</button></header><section class="content">${view()}</section></main></div>`}
function go(t){S.tab=t;S.selected=null;render()}
function view(){if(S.tab==='home')return home();if(S.tab==='lessons')return lessonList();if(S.tab==='quiz')return quizList();if(S.tab==='detail')return detail();return searchView()}
function home(){return `<section class="hero"><small>THƯ VIỆN CÁ NHÂN</small><h2>Lưu giữ bài học, Lời Chúa và hành trình học thần học của bạn.</h2><p>Tổ chức bài học trên lớp, bài học từ Kinh Thánh, câu hỏi trắc nghiệm và tài liệu nguồn trong cùng một nơi.</p><div class="actions"><button class="btn gold" onclick="openImport()">Thêm nội dung</button><button class="btn white" onclick="go('lessons')">Mở thư viện</button></div></section><div class="stats"><div class="stat"><b>${S.lessons.length}</b><span>Bài học</span></div><div class="stat"><b>${S.questions.length}</b><span>Câu hỏi</span></div><div class="stat"><b>${S.folders.length}</b><span>Thư mục</span></div><div class="stat"><b>1925</b><span>Bản Kinh Thánh</span></div></div><h3 class="title">Bài học gần đây</h3>${cards(S.lessons.slice(0,6))}`}
function cards(ls){return ls.length?`<div class="cards">${ls.map(l=>`<article class="card" onclick="openLesson('${l.id}')"><small>${esc(l.scripture_reference||'Bài học')}</small><h3>${esc(l.title)}</h3><p>${esc(l.summary||'Chưa có tóm tắt.')}</p></article>`).join('')}</div>`:`<div class="panel empty">Chưa có bài học.</div>`}
function lessonList(){return `<div class="panel"><h2 class="title" style="margin-top:0">Tất cả bài học</h2>${cards(S.lessons)}</div>`}
function quizList(){return `<div class="panel"><h2 class="title" style="margin-top:0">Câu hỏi & Đáp án</h2>${S.questions.length?S.questions.map((q,i)=>questionHtml(q,i)).join(''):'<div class="empty">Chưa có câu hỏi.</div>'}</div>`}
function searchView(){return `<div class="panel"><input placeholder="Tìm theo tiêu đề, câu Kinh Thánh…" oninput="doSearch(this.value)"><div id="results" style="margin-top:16px">${cards(S.lessons)}</div></div>`}
function doSearch(v){const x=v.toLowerCase();document.querySelector('#results').innerHTML=cards(S.lessons.filter(l=>(l.title+' '+(l.scripture_reference||'')+' '+(l.summary||'')).toLowerCase().includes(x)))}
function openLesson(id){S.selected=S.lessons.find(x=>x.id===id);S.tab='detail';render()}
function detail(){const l=S.selected;if(!l)return lessonList();const qs=S.questions.filter(q=>q.lesson_id===l.id);return `<article class="panel lesson"><small>${esc(l.scripture_reference||'')}</small><h2>${esc(l.title)}</h2>${l.key_verse_1925?`<blockquote><b>${esc(l.key_verse_reference||'Câu gốc · Bản 1925')}</b><br>${esc(l.key_verse_1925)}</blockquote>`:''}<p>${esc(l.summary||'')}</p>${l.introduction?`<h3>Giới thiệu</h3><p>${esc(l.introduction)}</p>`:''}${l.background?`<h3>Bối cảnh</h3><p>${esc(l.background)}</p>`:''}${l.application?`<h3>Áp dụng</h3><p>${esc(l.application)}</p>`:''}${l.prayer?`<h3>Lời cầu nguyện</h3><p>${esc(l.prayer)}</p>`:''}<h3>Câu hỏi</h3>${qs.length?qs.map((q,i)=>questionHtml(q,i)).join(''):'<p class="muted">Chưa có câu hỏi cho bài này.</p>'}</article>`}
function questionHtml(q,i){const o=q.options||{};const a=S.revealed[q.id];return `<div class="question"><b>Câu ${i+1}. ${esc(q.question_text)}</b><div class="opts">${['A','B','C','D'].map(k=>o[k]?`<div class="opt">${k}. ${esc(o[k])}</div>`:'').join('')}</div>${a?`<div class="answer"><b>Đáp án: ${esc(a.correct_option)}</b><div>${esc(a.explanation||'')}</div></div>`:`<button class="btn white" onclick="reveal('${q.id}')">Hiển thị đáp án đúng</button>`}</div>`}
function overlay(html){const d=document.createElement('div');d.className='overlay';d.innerHTML=html;document.body.appendChild(d);d.querySelector('.x')?.addEventListener('click',()=>d.remove());return d}
function unlock(){const d=overlay(`<div class="modal"><button class="x">×</button><h2>Mở quản trị</h2><div class="field"><label>Mã quản trị</label><input id="pin" type="password" inputmode="numeric"></div><div id="err"></div><div class="modalActions"><button class="btn gold" id="ok">Mở</button></div></div>`);d.querySelector('#ok').onclick=async()=>{try{const p=d.querySelector('#pin').value;await adm('verify_pin',{},p);S.pin=p;d.remove();alert('Đã mở chế độ quản trị.')}catch(e){d.querySelector('#err').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}}
function openImport(){if(!S.pin){unlock();return}const d=overlay(`<div class="modal"><button class="x">×</button><h2>Thêm nội dung</h2><p class="muted">Chọn loại dữ liệu cần nhập.</p><div class="methods"><button data-m="images">🖼️<br>Hình ảnh</button><button data-m="pdf">📄<br>PDF</button><button data-m="audio">🎙️<br>Ghi âm</button><button data-m="text">✍️<br>Văn bản</button></div></div>`);d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;d.remove();importModal(m)})}
function importModal(mode){let files=[];const multi=mode==='images';const lessonOptions=S.lessons.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('');const d=overlay(`<div class="modal"><button class="x">×</button><h2>${multi?'Tải hình ảnh':mode==='pdf'?'Tải PDF':mode==='audio'?'Tải ghi âm':'Dán văn bản'}</h2><div class="field"><label>Loại nội dung</label><select id="target"><option value="lesson">Bài học mới</option><option value="questions">Câu hỏi cho bài đã có</option></select></div><div id="lessonBox" class="field hidden"><label>Bài học đích</label><select id="lesson"><option value="">-- Chọn bài học --</option>${lessonOptions}</select></div><div id="folderBox" class="field"><label>Nơi lưu bài học</label><select id="folder"><option value="class-lessons">Bài học trên lớp</option><option value="scripture-lessons">Bài học từ Kinh Thánh</option></select></div>${mode==='text'?`<div class="field"><label>Nội dung</label><textarea id="text" rows="10"></textarea></div>`:`<div class="drop" id="drop"><b>${multi?'Chọn nhiều ảnh (tối đa 40)':'Chọn file'}</b><span class="muted">${multi?'Có thể chọn nhiều ảnh một lần hoặc chọn thêm nhiều lần.':'Nhấn để chọn file.'}</span><input id="file" type="file" ${multi?'multiple accept="image/*"':mode==='pdf'?'accept="application/pdf"':'accept="audio/*"'} hidden></div>${multi?`<button class="btn white" id="more" style="width:100%;margin-top:10px">+ Chọn thêm ảnh</button><div class="muted" id="count">0/40 ảnh</div><div class="preview" id="preview"></div>`:`<div class="muted" id="count">Chưa chọn file</div>`}`}</div><div id="err"></div><div class="modalActions"><button class="btn gold" id="process">Xử lý & xem trước</button></div>`);const target=d.querySelector('#target');target.onchange=()=>{const q=target.value==='questions';d.querySelector('#lessonBox').classList.toggle('hidden',!q);d.querySelector('#folderBox').classList.toggle('hidden',q)};if(mode!=='text'){const input=d.querySelector('#file'),drop=d.querySelector('#drop'),upd=()=>{d.querySelector('#count').textContent=multi?`${files.length}/40 ảnh`:files[0]?.name||'Chưa chọn file';if(multi)d.querySelector('#preview').innerHTML=files.map((f,i)=>`<span class="chip">${i+1}. ${esc(f.name)} <button data-rm="${i}">×</button></span>`).join('');d.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rm,1);upd()})};drop.onclick=()=>input.click();d.querySelector('#more')?.addEventListener('click',()=>input.click());input.onchange=e=>{const picked=[...(e.target.files||[])];if(multi){const n=Math.max(0,40-files.length);files.push(...picked.slice(0,n));if(picked.length>n)d.querySelector('#err').innerHTML='<div class="error">Tối đa 40 ảnh.</div>';input.value=''}else files=picked.slice(0,1);upd()};['dragover','drop'].forEach(ev=>drop.addEventListener(ev,e=>e.preventDefault()));drop.addEventListener('drop',e=>{if(!multi)return;const picked=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));const n=Math.max(0,40-files.length);files.push(...picked.slice(0,n));upd()})}
d.querySelector('#process').onclick=async()=>{const targetType=target.value,lessonId=d.querySelector('#lesson')?.value||'',folder=d.querySelector('#folder')?.value||'class-lessons',text=d.querySelector('#text')?.value||'';if(targetType==='questions'&&!lessonId){d.querySelector('#err').innerHTML='<div class="error">Bạn phải chọn bài học mà bộ câu hỏi này thuộc về.</div>';return}if(mode!=='text'&&!files.length){d.querySelector('#err').innerHTML='<div class="error">Chưa chọn file.</div>';return}try{const b=d.querySelector('#process');b.disabled=true;b.textContent='Đang xử lý…';const fd=new FormData();fd.append('mode',mode);fd.append('target_type',targetType);fd.append('target_lesson_id',lessonId);fd.append('target_lesson_title',S.lessons.find(x=>x.id===lessonId)?.title||'');fd.append('folder_slug',folder);fd.append('text',text);files.forEach(f=>fd.append(multi?'files':'file',f));const r=await fetch(AI,{method:'POST',headers:{'x-admin-pin':S.pin},body:fd});const j=await r.json();if(!r.ok)throw Error(j.error||'Không xử lý được');d.remove();previewResult(j.lesson||j,{targetType,lessonId,folder,files,mode})}catch(e){d.querySelector('#err').innerHTML='<div class="error">'+esc(e.message)+'</div>';d.querySelector('#process').disabled=false;d.querySelector('#process').textContent='Xử lý & xem trước'}}}
function previewResult(v,ctx){const qs=v.questions||[];if(ctx.targetType==='questions'){const d=overlay(`<div class="modal"><button class="x">×</button><h2>Xem trước bộ câu hỏi</h2><p>${qs.length} câu hỏi · sẽ gắn vào <b>${esc(S.lessons.find(x=>x.id===ctx.lessonId)?.title||'')}</b></p>${qs.map((q,i)=>`<div class="question"><b>Câu ${i+1}. ${esc(q.question_text||q.question||'')}</b></div>`).join('')}<div class="modalActions"><button class="btn gold" id="save">Lưu câu hỏi</button></div></div>`);d.querySelector('#save').onclick=async()=>{for(let i=0;i<qs.length;i++){const z=qs[i],o=Array.isArray(z.options)?Object.fromEntries(['A','B','C','D'].map((k,j)=>[k,z.options[j]||''])):(z.options||{});await adm('save_question',{question:{lesson_id:ctx.lessonId,question_text:z.question_text||z.question||'',options:o,sort_order:i+1,scripture_reference:z.scripture_reference||''},answer:{correct_option:z.correct_option||'',explanation:z.explanation||'',scripture_reference:z.scripture_reference||''}})}d.remove();await load();go('quiz')};return}const d=overlay(`<div class="modal"><button class="x">×</button><h2>Xem trước bài học</h2><div class="field"><label>Tựa đề</label><input id="t" value="${esc(v.title||'')}"></div><div class="field"><label>Tóm tắt</label><textarea id="s" rows="5">${esc(v.summary||'')}</textarea></div><div class="modalActions"><button class="btn gold" id="save">Lưu bài học</button></div></div>`);d.querySelector('#save').onclick=async()=>{const lesson={title:d.querySelector('#t').value,summary:d.querySelector('#s').value,scripture_reference:v.scripture_reference||'',key_verse_reference:v.key_verse_reference||'',key_verse_1925:v.key_verse_1925||'',introduction:v.introduction||'',background:v.background||'',application:v.application||'',prayer:v.prayer||'',main_content:v.main_content||[],reflection_questions:v.reflection_questions||[],tags:v.tags||[],source_kind:ctx.mode,is_published:true,folder_slug:ctx.folder};const res=await adm('save_lesson',{lesson});for(const f of ctx.files){const up=await adm('create_upload_url',{file_name:f.name});await fetch(up.signed_url,{method:'PUT',headers:{'content-type':f.type||'application/octet-stream'},body:f});await adm('register_attachment',{attachment:{lesson_id:res.lesson.id,file_name:f.name,file_path:up.path,mime_type:f.type,file_size:f.size,source_kind:ctx.mode}})}d.remove();await load();openLesson(res.lesson.id)} }
async function reveal(id){try{let p=S.pin;if(!p){p=prompt('Nhập mã 2211 để xem đáp án');if(!p)return}const r=await adm('reveal_answer',{question_id:id},p);S.pin=p;S.revealed[id]=r.answer;render()}catch(e){alert(e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load().catch(e=>document.querySelector('#root').innerHTML='<div class="empty">Không tải được dữ liệu: '+esc(e.message)+'</div>');
</script></body></html>
