<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi phí AI · Thư Viện Thần Học</title><style>:root{--navy:#0b2346;--gold:#d7ad4f;--cream:#f6f1e7;--ink:#1d2b3f;--muted:#768292}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{background:#0b2346;color:white;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font:700 28px Georgia,serif}.top button{border:1px solid #ffffff44;background:#ffffff10;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:24px}.panel,.stat{background:#fff;border:1px solid #e4dccf;border-radius:18px;box-shadow:0 10px 30px #17314d10}.panel{padding:22px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{padding:18px}.stat b{display:block;font:700 28px Georgia,serif;color:#173b68}.stat span{font-size:12px;color:var(--muted)}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.gold{background:linear-gradient(#e5c36a,#c99630);color:#172238}.white{background:#fff;border:1px solid #ddd5c8;color:#17345e}.muted{font-size:12px;color:var(--muted)}.error{background:#fff1e8;color:#934918;padding:12px;border-radius:10px}input{width:100%;border:1px solid #ddd6ca;border-radius:10px;padding:12px;font:inherit}.login{max-width:480px;margin:70px auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #eee8de;text-align:left}th:last-child,td:last-child{text-align:right}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}</style></head><body><header class="top"><h1>Chi phí AI · Quản trị</h1><button onclick="history.back()">← Quay lại thư viện</button></header><main class="wrap"><div id="app"></div></main><script>const END='https://cikobcunfmnvlyutlyai.supabase.co/functions/v1/theology-ai-cost';let PIN='';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=(v,d=4)=>'$'+Number(v||0).toFixed(d);const fmt=v=>{try{return new Date(v).toLocaleString('vi-VN')}catch{return ''}};async function call(action,payload={}){const r=await fetch(END,{method:'POST',headers:{'content-type':'application/json','x-admin-pin':PIN},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Không tải được dữ liệu');return j}function login(){document.getElementById('app').innerHTML='<div class="panel login"><h2 style="font-family:Georgia,serif;color:#173b68">Mở bảng chi phí AI</h2><p class="muted">Dữ liệu này chỉ dành cho quản trị.</p><input id="pin" type="password" inputmode="numeric" placeholder="Mã quản trị"><div id="err" style="margin-top:10px"></div><button class="btn gold" style="width:100%;margin-top:12px" onclick="doLogin()">Mở</button></div>'}async function doLogin(){PIN=document.getElementById('pin').value;try{await load()}catch(e){document.getElementById('err').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function load(){const d=await call('summary');render(d)}async function budget(){const v=prompt('Nhập TỔNG số tiền API đã nạp (USD):');if(v===null)return;const n=Number(v);if(!Number.isFinite(n)||n<0)return alert('Số tiền không hợp lệ');await call('set_budget',{funded_usd:n});await load()}function render(d){const s=d.summary||{},rows=Array.isArray(d.rows)?d.rows:[];document.getElementById('app').innerHTML='<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0;font-family:Georgia,serif;color:#173b68">Theo dõi chi phí AI</h2><p class="muted">Tính từ token thực tế mà API trả về cho các lần tạo trong app.</p></div><div><button class="btn white" onclick="budget()">Cập nhật tiền đã nạp</button> <button class="btn gold" onclick="load()">↻ Làm mới</button></div></div></div><div class="stats"><div class="stat"><b>'+money(s.funded_usd,2)+'</b><span>Tổng tiền đã nạp</span></div><div class="stat"><b>'+money(s.spent_usd,4)+'</b><span>Đã dùng trong app</span></div><div class="stat"><b>'+money(s.remaining_usd,4)+'</b><span>Số dư theo dõi</span></div><div class="stat"><b>'+Number(s.generation_count||0)+'</b><span>Tổng số lần tạo</span></div></div><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>'+Number(s.month_count||0)+'</b><span>Số lần tạo tháng này</span></div><div class="stat"><b>'+money(s.month_spent_usd,4)+'</b><span>Chi phí tháng này</span></div></div><div class="panel" style="overflow:auto"><h3 style="font-family:Georgia,serif;color:#173b68">Lịch sử từng lần tạo</h3>'+(rows.length?'<table><thead><tr><th>Thời gian</th><th>Bài học</th><th>Model</th><th>Input</th><th>Output</th><th>Tổng token</th><th>Chi phí</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(fmt(r.created_at))+'</td><td>'+esc(r.request_title||'Tạo bài học')+'</td><td>'+esc(r.model||'')+'</td><td>'+Number(r.input_tokens||0).toLocaleString()+'</td><td>'+Number(r.output_tokens||0).toLocaleString()+'</td><td>'+Number(r.total_tokens||0).toLocaleString()+'</td><td><b>'+money(r.estimated_cost_usd,6)+'</b></td></tr>').join('')+'</tbody></table>':'<p class="muted">Chưa có lần tạo AI nào được ghi nhận kể từ khi bật theo dõi.</p>')+'</div><p class="muted">Số dư này là số dư theo dõi của riêng app: tiền bạn nhập trừ chi phí app ghi nhận. Nếu API key dùng ở nơi khác, số dư thực tế OpenAI có thể khác.</p>'}login();</script></body></html>
