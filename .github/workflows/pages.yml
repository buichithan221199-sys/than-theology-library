name: Deploy Theology Library to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate manifest and public patch references
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, re, ast
          json.load(open('manifest.webmanifest', encoding='utf-8'))
          text=pathlib.Path('static-app.html').read_text(encoding='utf-8')
          m=re.search(r"const files=\[(.*?)\];", text, re.S)
          if not m:
              raise SystemExit('Cannot find static-app patch list')
          files=ast.literal_eval('['+m.group(1)+']')
          missing=[f for f in files if not pathlib.Path(f).is_file()]
          if missing:
              raise SystemExit('Missing patch files: '+', '.join(missing))
          if len(files)!=len(set(files)):
              raise SystemExit('Duplicate patch names in static-app.html')
          print(f'Validated {len(files)} production patch files')
          PY

      - name: Build static site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/base.html
          cp static-app.html _site/index.html
          cp manifest.webmanifest app-icon.svg service-worker.js _site/
          python3 - <<'PY'
          import pathlib, re, ast, shutil
          text=pathlib.Path('static-app.html').read_text(encoding='utf-8')
          m=re.search(r"const files=\[(.*?)\];", text, re.S)
          files=ast.literal_eval('['+m.group(1)+']')
          for f in files:
              shutil.copy2(f, pathlib.Path('_site')/f)
          print('Copied production assets:', len(files))
          PY
          test -f _site/index.html
          test -f _site/base.html
          test -f _site/security-patch.js
          test -f _site/pdf-language-patch.js
          test -f _site/print-stability-patch.js
          test -f _site/service-worker.js
          test ! -f _site/admin-cost-loader.js
          test ! -f _site/lesson-depth-display-patch.js

      - name: Add PureRec download site and installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p _site/purerec/downloads
          cp purerec-site/index.html _site/purerec/index.html

          echo "Downloading PureRec Windows installer artifact..."
          gh run download 35309742854 -n PureRec-Windows-1.0.1 -D _site/purerec/downloads

          echo "Downloading PureRec Android APK artifact..."
          gh run download 35309010684 -n PureRec-Android-1.0 -D _site/purerec/downloads

          test -f _site/purerec/index.html
          test -f _site/purerec/downloads/PureRec-Setup-1.0.1.exe
          test -f _site/purerec/downloads/PureRec-Android-1.0.apk
          echo "PureRec download site bundled successfully."

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy browser smoke test
        run: |
          set -e
          URL="${{ steps.deployment.outputs.page_url }}?smoke=${GITHUB_SHA}"
          echo "Testing $URL"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "$URL" >/tmp/theology-root.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          grep -q 'security-patch.js' /tmp/theology-root.html
          grep -q 'pdf-language-patch.js' /tmp/theology-root.html
          grep -q 'mobile-polish-patch.js' /tmp/theology-root.html
          grep -q 'print-stability-patch.js' /tmp/theology-root.html

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome/Chromium not available; HTTP smoke checks passed."
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$URL" >/tmp/theology-dom.html 2>/tmp/chrome-stderr.log || {
            cat /tmp/chrome-stderr.log
            exit 1
          }

          # Parse actual rendered elements/text while ignoring <script>/<style> source.
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class RenderedDOM(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip = 0
                  self.classes = []
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag in ('script','style'):
                      self.skip += 1
                  attrs = dict(attrs)
                  if 'class' in attrs:
                      self.classes.extend(attrs['class'].split())
              def handle_endtag(self, tag):
                  if tag in ('script','style') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      t = ' '.join(data.split())
                      if t:
                          self.text.append(t)

          p = RenderedDOM()
          p.feed(Path('/tmp/theology-dom.html').read_text(encoding='utf-8', errors='replace'))
          visible = ' '.join(p.text)
          if 'app' not in p.classes:
              raise SystemExit('Rendered app shell not found')
          if 'folder-tile' not in p.classes:
              raise SystemExit('No rendered folder tile found; public data may not have loaded')
          if 'Không tải được dữ liệu' in visible:
              raise SystemExit('Visible app reports a data loading error')
          if 'Thư mục nội dung' not in visible:
              raise SystemExit('Rendered home folder section not found')
          print('Browser DOM smoke test passed.')
          PY
