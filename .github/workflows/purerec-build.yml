# PureRec Windows hotfix 1.0.1
name: Build PureRec Windows 1.0.1

on:
  push:
    branches: [purerec-build]
    paths:
      - ".github/workflows/purerec-build.yml"

jobs:
  windows:
    name: Windows installer 1.0.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: purerec-build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: purerec/windows/package.json
      - name: Install dependencies
        working-directory: purerec/windows
        run: npm install
      - name: Build PureRec Setup.exe
        working-directory: purerec/windows
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PureRec-Windows-1.0.1
          path: purerec/windows/dist/PureRec-Setup-1.0.1.exe
          if-no-files-found: error
